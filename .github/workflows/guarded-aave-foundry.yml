name: Guarded Aave contract tests

on:
  pull_request:
    paths:
      - "contracts/**"
      - "scripts/check_aave_wiring*"
      - ".github/workflows/guarded-aave-foundry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check read-only Aave/recipient verifier (Node 20)
        run: node --test scripts/check_aave_wiring.test.mjs
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Install forge-std test dependency
        run: |
          mkdir -p contracts/lib
          git clone --depth 1 https://github.com/foundry-rs/forge-std.git contracts/lib/forge-std
      - name: Compile and test guarded Aave receiver
        run: |
          cd contracts
          forge build
          forge test -vvv
