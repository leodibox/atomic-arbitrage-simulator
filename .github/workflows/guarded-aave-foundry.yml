name: Guarded Aave contract tests

on:
  pull_request:
    paths:
      - "contracts/**"
      - "scripts/check_aave_wiring*"
      - ".github/workflows/guarded-aave-foundry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check read-only Aave/recipient verifier (Node 20)
        run: node --test scripts/check_aave_wiring.test.mjs
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Install forge-std test dependency
        run: |
          mkdir -p contracts/lib
          git clone --depth 1 https://github.com/foundry-rs/forge-std.git contracts/lib/forge-std
      - name: Compile guarded Aave receiver
        working-directory: contracts
        run: forge build
      - name: Test guarded Aave receiver and report fork coverage
        working-directory: contracts
        env:
          HTTPS_URL: ${{ secrets.HTTPS_URL }}
        shell: bash
        run: |
          if [[ -z "${HTTPS_URL:-}" ]]; then
            coverage="Aave mainnet fork not verified: HTTPS_URL is unavailable. Fork tests are skipped."
            echo "::warning::$coverage"
          else
            coverage="HTTPS_URL is configured. Skipped tests fail this job."
          fi
          echo "$coverage" >> "$GITHUB_STEP_SUMMARY"

          results=$(mktemp)
          trap 'rm -f "$results"' EXIT
          forge_status=0
          forge test -vvv --color never | tee "$results" || forge_status=${PIPESTATUS[0]}
          mapfile -t totals < <(sed -nE 's/^Ran .*: ([0-9]+) tests? passed, ([0-9]+) failed, ([0-9]+) skipped .*/\1 \2 \3/p' "$results")
          if (( ${#totals[@]} != 1 )); then
            echo "::error::Forge did not produce a test totals line."
            exit 1
          fi
          read -r passed failed skipped <<< "${totals[0]}"
          printf 'Foundry: %s passed, %s failed, %s skipped.\n' "$passed" "$failed" "$skipped" | tee -a "$GITHUB_STEP_SUMMARY"

          if (( forge_status != 0 || failed > 0 || passed == 0 )); then
            echo "::error::Foundry failed or no tests passed."
            exit 1
          fi
          if [[ -n "${HTTPS_URL:-}" ]] && (( skipped > 0 )); then
            echo "::error::Foundry skipped $skipped tests despite HTTPS_URL being configured."
            exit 1
          fi
