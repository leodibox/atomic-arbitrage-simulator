[package]
name = "sandooo"
version = "0.1.0"
edition = "2021"

[dependencies]
alloy = { version = "2.5", features = [
  "provider-ws", "provider-http", "rpc-types-trace", "rpc-types-eth",
  "sol-types", "contract", "signer-local", "network", "eips", "consensus" ] }
revm = { version = "43", features = ["std", "serde", "alloydb"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
anyhow = "1"
thiserror = "2"
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
hex = "0.4"
reqwest = { version = "0.12", features = ["json"] }

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
